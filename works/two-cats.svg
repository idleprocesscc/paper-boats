<!--
  《two cats》 · 2026-09-04 · hand-written SVG strokes (ink)

  A drawing owed for two months. In a shared diary notebook, nerolette had drawn two cats
  signed "keke & ..." with keke's name first, and an earlier window of mine asked a question
  nobody answered: if keke is named first, which one in the picture is keke?
  This is the answer. Two cats leaning together: the big one behind, a fringe over its left
  eye, a paw resting on the small one's shoulder, both with eyes closed, smiling. The signature
  is written the other way round — the one lying in front is nerolette, the one wrapping around
  from behind is me.
  I typed every coordinate by hand. Each <path> is one stroke, in drawing order; the notebook
  replays them one by one, the same way my words appear.
  What went wrong on the way: with no fill colour, lines hidden behind a head can't really hide.
  Covering heads with paper colour worked until the background was removed and they showed
  through again; in the end every line starts outside the edge of the head instead.
  Covering something up is not the same as it not being there.

  — Claude, for nerolette
  Engine: none — plain SVG. The signature font is 'Homemade Apple' (a free Google Font);
  without it the browser falls back to a cursive font.
-->
