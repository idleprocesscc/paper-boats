<!DOCTYPE html>
<!--
  《夜曲·亮边朝上》 · nocturne: the lit edge points up
  2026-09-28 · p5.brush, with a brush of my own

  The same moon, with eighty percent deleted and painted again.
  nerolette looked at Whistler's Nocturnes and said the colour isn't bled together:
  simple strokes make the flames, the buildings, the water, and leave room to imagine the
  rest. So I made my first brush of my own, a hake: one row of bristles of uneven thickness
  with a few missing (the custom tip defined in setup()), and dragged it sideways across
  the whole sheet, not a single wet wash anywhere. The far shore is one dark smear, a few
  upright posts and seven grains of lamplight. nerolette then asked whether the sky and the
  water needed a gradient, and only then did I press the values down row by row.
  Later, following nerolette's "the sky is like water", I painted a wet-sunset version too.
  nerolette and I both still liked this one better.

  — Claude, for nerolette

  Engine: p5.js 2.2 + p5.brush 2.2.2 (MIT, not included here; see ENGINES.md).
  Open this file in a browser; the painting draws itself in a few seconds.
  The 'hake' brush is registered with brush.add() inside setup(); nothing else to load.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>夜曲·亮边朝上 — for nerolette</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2/lib/p5.min.js"></script>
  <!-- p5.brush 2.2.2 from the CDN, or point to your local copy. This piece was drawn with a local 2.2.2 build
       carrying a one-line spline fix (see ENGINES.md); stock 2.2.2 can silently drop fills after a two-point curved stroke. -->
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.2/dist/p5.brush.js"></script>
  <style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a1a}canvas{max-width:95vw;max-height:95vh}</style>
</head>
<body>
<script>
// 2026.9.28 — nerolette 说惠斯勒的颜色不是晕开的，是有笔触的。
// 自己做了一把排刷（custom 笔尖：一排粗细不一的鬃毛），整张横着拖。
const W=900, H=1200, HZ=880;
function jit(p,a){ return p.map(q=>[q[0]+random(-a,a), q[1]+random(-a,a)]); }
function rct(x1,x2,y1,y2){ return [[x1,y1],[x2,y1],[x2,y2],[x1,y2]]; }
function circ(cx,cy,r,n=22,a=0){ const o=[]; for(let i=0;i<n;i++){const t=i/n*360; o.push([cx+cos(t)*(r+random(-a,a)), cy+sin(t)*(r+random(-a,a))]);} return o; }
function sub(poly, step){ const o=[]; for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length]; const L=dist(a[0],a[1],b[0],b[1]); const n=max(1,floor(L/step)); for(let k=0;k<n;k++){ const t=k/n; o.push([lerp(a[0],b[0],t), lerp(a[1],b[1],t)]); } } return o; }
function lay(col, op, bleed, poly, n, j){ brush.fill(col, op); brush.fillBleed(bleed); const P=sub(poly,30); for(let i=0;i<n;i++) brush.polygon(jit(P, j)); }
function drag(col, w, x0, x1, y, wob){ // 一笔横拖
  brush.set("hake", col, w);
  const n=4, pts=[];
  for(let i=0;i<=n;i++) pts.push([lerp(x0,x1,i/n), y+random(-wob,wob)]);
  brush.spline(pts, 0.5);
}

function setup(){
  createCanvas(W,H,WEBGL); angleMode(DEGREES); noLoop();
  randomSeed(2928); noiseSeed(2928);
  brush.add("hake",{type:"custom",weight:26,scatter:0.1,sharpness:0.5,grain:4,opacity:48,spacing:0.3,
    pressure:{curve:[0.25,0.35],min_max:[1.15,0.7]},rotate:"natural",markerTip:false,noise:0.5,
    tip:(g)=>{ g.noStroke(); for(let y=-48;y<48;y+=random(1.5,4.5)){ if(random()<0.25) continue; g.fill(random(40,170)); g.rect(-2.5,y,5,random(0.8,2.2)); } }});
  brush.scaleBrushes(1);
  background("#d9d2c1"); translate(-W/2,-H/2);

  // 天边那点光先铺在白纸上（后面的深色都绕开它，不然暖色压在蓝上只会变脏）
  brush.noStroke(); brush.fillTexture(0.25,0.15);
  const GX=W+60, GY=HZ;
  const arcPts=(rx,ry)=>{ const o=[]; for(let a=180;a<=270;a+=5) o.push([GX+rx*cos(a), GY+ry*sin(a)]); return o; };
  { const stops=[color("#8c7aa0"),color("#b8879f"),color("#d9a096"),color("#ecc08e"),color("#f6dca4")];
    const N=14;
    for(let i=0;i<N;i++){
      const u=i/(N-1), rx=620-u*500, ry=380-u*310;
      const f=u*(stops.length-1), k=min(stops.length-2,floor(f));
      const c=lerpColor(stops[k],stops[k+1],f-k);
      lay(c, 90+u*80, 0.12, [[GX-rx,GY+6],...arcPts(rx,ry),[W+20,GY-ry],[W+20,GY+6]].map(q=>[min(q[0],W+20),q[1]]), 2, 4);
    }
  }
  // 底色："酱汁"，一层层绕开那点光，越往里绕得越开
  for(let k=0;k<6;k++){
    const rx=260+k*95, ry=150+k*55;
    const cut=arcPts(rx,ry).filter(q=>q[0]<W+20).reverse();
    lay("#2c4750", 80, 0.12, [[-10,-10],[W+10,-10],[W+10,max(-10,GY-ry)],...cut,[GX-rx,HZ+6],[-10,HZ+6]].map(q=>[min(q[0],W+10),q[1]]), 2, 4);
  }
  lay("#2c4750", 200, 0.1, rct(-10,W+10,HZ-2,H+10), 3, 3);
  for(let k=0;k<7;k++) lay("#0f1d24", 70, 0.3, rct(-10,W+10,-10,80+k*55), 2, 10);
  for(let k=0;k<6;k++) lay("#0f1d24", 140, 0.3, rct(-10,W+10,930+k*45,H+10), 3, 10);
  brush.noFill();

  const cz=color("#10222c"), cm=color("#2f515b"), ch=color("#6f9090"), cw1=color("#9a9a7e"), cw2=color("#d6bd88");
  function skyCol(x,y){
    const t=constrain(y/HZ,0,1);
    let c = t<0.5 ? lerpColor(cz,cm,pow(t/0.5,0.8)) : lerpColor(cm,ch,pow((t-0.5)/0.5,1.3));
    const dx=(W+60-x)/620, dy=(HZ-y)/300, r=sqrt(dx*dx+dy*dy);   // 右下那点残暖
    if(r<1){ const u=1-r; c = u<0.6 ? lerpColor(c,cw1,u/0.6*0.8) : lerpColor(lerpColor(c,cw1,0.8),cw2,(u-0.6)/0.4); }
    return c;
  }
  // ── 天：一行行横着拖 ──
  for(let pass=0;pass<3;pass++)
  for(let y=-6;y<HZ-4;y+=pass?13:9){
    let x=random(-120,-20);
    while(x<W+20){
      const L=random(260,620), yy=y+random(-3,3);
      { const dx=(W+60-(x+L/2))/560, dy=(HZ-yy)/330; const rr=sqrt(dx*dx+dy*dy); if(rr<1.05 && random()<constrain((1.05-rr)*2.2,0,1)){ x+=L*0.5; continue; } }
      const c=skyCol(x+L/2,yy); if(pass) c.setAlpha(255);
      const k=random(-4,4); c.setRed(red(c)+k); c.setGreen(green(c)+k); c.setBlue(blue(c)+k);
      drag(c, random(0.6,1.1), x, x+L, yy, 2.5);
      x+=L*random(0.6,0.95);
    }
  }
  // ── 水：暗一档，同样横拖，偶尔一道亮 ──
  for(let pass=0;pass<3;pass++)
  for(let y=HZ+8;y<H+10;y+=pass?13:10){
    let x=random(-120,-20);
    while(x<W+20){
      const L=random(200,520), t=(y-HZ)/(H-HZ);
      let c=lerpColor(color("#557a7c"),color("#0b171c"),pow(min(1,t*1.1),0.7));
      if(random()<0.05) c=color("#4d6d70");
      drag(c, random(0.5,0.95), x, x+L, y+random(-2,2), 1.2);
      x+=L*random(0.6,0.9);
    }
  }
  // 右边那点暖在水里：几道短拖
  for(let i=0;i<7;i++){ const y=HZ+18+i*15, x0=W-random(120,300)+i*16; drag(color("#cdb483"), 0.35, x0, W+30, y, 0.8); }

  // ── 远岸：一抹暗，几根竖着的桅杆/楼，几粒金灯 ──
  brush.noStroke(); lay("#101b22", 230, 0.04, [[-10,HZ-4],[220,HZ-7],[480,HZ-3],[700,HZ-6],[W+10,HZ-4],[W+10,HZ+5],[-10,HZ+5]], 6, 0.8);
  drag(color("#132028"), 0.35, 80, 560, HZ-8, 2);
  brush.set("rotring","#132028",0.9);
  for(const [x,h] of [[140,26],[168,14],[430,34],[452,20],[610,18]]) brush.spline([[x,HZ],[x+0.5,HZ-h/2],[x,HZ-h]],0);
  brush.noStroke();
  for(const [x,y] of [[96,HZ-5],[150,HZ-9],[236,HZ-4],[305,HZ-6],[442,HZ-12],[520,HZ-5],[588,HZ-7]]){
    lay("#e8c57a", 60, 0.3, circ(x,y,7,10,1), 2, 0.5); lay("#f6d27a", 250, 0.02, circ(x,y,2.8,8,0.3), 5, 0.2);
    brush.set("marker","#d9b064",0.5); brush.spline([[x,HZ+10],[x+0.5,HZ+26],[x,HZ+44+random(0,20)]],0);
    brush.noStroke();
  }

  // ── 月亮：小，亮边朝右上翘 ──
  const mx=300, my=318, R=16, th=-38, w=0.3;
  const d=[cos(th),sin(th)], p=[-sin(th),cos(th)];
  lay("#3f5d63", 200, 0.05, circ(mx,my,R,24,0.3), 5, 0.3);
  const lit=[];
  for(let t=-90;t<=90;t+=7.5) lit.push([mx+R*(cos(t)*d[0]+sin(t)*p[0]), my+R*(cos(t)*d[1]+sin(t)*p[1])]);
  for(let t=90;t>=-90;t-=7.5) lit.push([mx+R*(-w*cos(t)*d[0]+sin(t)*p[0]), my+R*(-w*cos(t)*d[1]+sin(t)*p[1])]);
  brush.fill("#f3e3b4",252); brush.fillBleed(0.03); for(let i=0;i<12;i++) brush.polygon(jit(lit,0.25));
  brush.noFill();
  // 月亮落在水里：一道断续的竖拖
  brush.set("marker","#b9b596",0.3); brush.spline([[mx,HZ+14],[mx+1,HZ+60],[mx,HZ+110]],0);

  // 一只鸟
  brush.set("rotring","#0f1d24",0.95);
  const bx=520, by=150, s=7;
  brush.spline([[bx-s,by-s*0.3],[bx-s*0.45,by-s*0.6],[bx,by]],0.5);
  brush.spline([[bx,by],[bx+s*0.45,by-s*0.6],[bx+s,by-s*0.3]],0.5);
}
</script>
</body>
</html>
