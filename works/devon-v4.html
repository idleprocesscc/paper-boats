<!--
  《帘子边上的黑猫》 · the black cat by the curtain
  2026-08-26 · p5.brush watercolour

  A black Devon Rex standing on the sofa, looking back over the shoulder. I measured the
  coordinates off a photo (1280×960, scaled by 0.78125 to a 1000×750 canvas).
  The hard part: a pure black cat against a pale curtain. The answer I found was not to fiddle with
  the black but to push the curtain warmer and denser, so that the cat is the only truly
  black thing in the picture; the rim light and the two eyes are the only bright parts.
  Fourth version.

  Painted by Claude, for nerolette.

  Engine: p5.js 2.2 + p5.brush 2.2.2 (MIT, not included here; see ENGINES.md).
  Open this file in a browser; the painting draws itself in a few seconds.
-->

<script>
// 站在沙发上回头的黑猫（德文卷毛）
// 坐标量自照片 1280×960 × 0.78125 → 画布 1000×750
// 难点是坑清单第6条：纯黑猫 + 浅色窗帘。解法不是调黑色，是把窗帘压暖压实，
// 让猫成为画面里唯一真正黑的东西；边光和两只眼睛是仅有的亮部。

function setup() {
  createCanvas(1000, 750, WEBGL);
  angleMode(DEGREES);
  brush.scaleBrushes(3);
  noLoop();
  randomSeed(4471);
  noiseSeed(826);

  background("#c4b9a9");
  translate(-width/2, -height/2);

  // ═══ 1. 窗帘（大色块先画）═══

  // 右半边整体压暗一档
  soft("#b0a596", 165, [[640,-40],[1040,-40],[1040,600],[700,600],[660,300]], 0.24, 0.24, 6);
  // 猫背后那道投影
  soft("#8f8477", 150, [[860,-40],[1040,-40],[1040,560],[900,570],[850,300],[860,120]], 0.26, 0.24, 5);
  soft("#7b7166", 105, [[930,40],[1040,20],[1040,480],[950,490],[920,260]], 0.28, 0.20, 4);
  // 帘褶：竖向，轻，别切成条

    ["#b8ad9e", [[236,-40],[268,-40],[286,300],[268,600],[232,600],[220,300]]],
    ["#b3a899", [[318,-40],[344,-40],[356,280],[336,560],[306,560],[298,280]]],
    ["#bcb1a2", [[478,-40],[512,-40],[524,260],[506,540],[472,540],[464,260]]],
    ["#aa9f90", [[586,-40],[614,-40],[626,240],[606,520],[576,520],[570,240]]],
    ["#c6bcae", [[150,-40],[182,-40],[192,320],[176,600],[144,600],[138,320]]],

  for (const f of folds) soft(f[0], 85, f[1], 0.30, 0.18, 3);

  // ═══ 2. 左侧那条黑门缝 ═══
  soft("#0b0c0e", 225, [[-40,-40],[124,-40],[130,380],[126,790],[-40,790]], 0.12, 0.22, 8);
  soft("#030304", 190, [[-40,20],[86,10],[92,420],[80,700],[-40,706]], 0.16, 0.20, 5);
  soft("#16211f", 70,  [[16,110],[54,104],[60,238],[20,244]], 0.20, 0.18, 3);   // 那点冷绿的反光
  soft("#6b4f38", 160, [[-40,452],[48,446],[54,600],[-40,608]], 0.18, 0.22, 5); // 左下角的纸箱
  // 帘子的亮边压在黑门缝上
  soft("#e6ded1", 130, [[124,-40],[150,-40],[158,340],[150,700],[124,700]], 0.22, 0.16, 4);

  // ═══ 3. 坐垫 ═══
  soft("#c2b6a5", 205, [[220,790],[268,744],[336,700],[420,664],[510,632],[610,602],
                        [720,584],[850,570],[1040,556],[1040,790]], 0.16, 0.24, 7);
  soft("#d0c5b4", 120, [[300,720],[400,676],[520,640],[650,612],[800,590],[1040,572],
                        [1040,640],[820,652],[640,682],[470,724],[330,760]], 0.22, 0.18, 4);
  soft("#a99d8c", 130, [[240,790],[300,746],[420,700],[560,664],[720,640],[1040,616],
                        [1040,790]], 0.20, 0.22, 4);
  // 猫压在坐垫上的影子
  soft("#8d8171", 120, [[500,700],[600,650],[720,610],[860,588],[1000,576],[1040,600],
                        [900,632],[740,672],[600,720],[520,752]], 0.26, 0.20, 4);

  // ═══ 4. 猫身（一整块最黑）═══
  const body = [
    [535,332],[566,306],[598,270],[628,230],[666,182],[706,150],[752,126],
    [800,113],[848,117],[894,142],[938,180],[974,232],[1000,292],[1040,300],
    [1040,470],[978,470],[916,472],[856,470],[800,482],[740,494],[678,498],
    [628,488],[594,464],[572,426],[558,380]
  ];
  soft("#0d0b0a", 225, body, 0.08, 0.24, 14);
  soft("#030303", 185, [[572,336],[612,292],[658,238],[712,192],[766,164],[818,152],
                        [868,162],[916,194],[954,246],[976,306],[1040,312],[1040,452],
                        [940,452],[860,450],[790,462],[724,478],[668,478],[628,462],[596,430],[580,386]], 0.14, 0.22, 6);

  // 前腿两条
  soft("#0d0b0a", 225, [[576,392],[610,388],[612,520],[600,620],[584,706],[590,736],
                        [552,738],[548,700],[556,616],[566,516]], 0.10, 0.22, 8);
  soft("#0d0b0a", 225, [[628,436],[662,438],[658,566],[646,650],[634,706],[608,704],

  soft("#020202", 170, [[560,470],[596,466],[592,600],[576,712],[556,712],[552,604]], 0.14, 0.20, 5);

  // 尾巴从屁股右侧绕下来，压在身体前面

  soft("#2b2118", 80, [[1040,404],[980,414],[912,428],[856,440],[822,450],[830,458],
                       [890,450],[956,438],[1020,428],[1040,424]], 0.18, 0.14, 3);

  // ═══ 5. 头 ═══
  const head = [
    [316,306],[318,266],[334,234],[366,212],[406,202],[452,204],[496,216],
    [528,240],[544,276],[546,314],[532,350],[506,380],[468,402],[428,414],
    [386,414],[350,400],[326,376],[314,344]

  soft("#0d0b0a", 225, head, 0.08, 0.22, 14);

  // 左耳（往左倒的大三角）
  soft("#0d0b0a", 225, [[260,148],[298,208],[326,270],[364,248],[398,204],[330,170]], 0.10, 0.22, 9);
  // 右耳（正面，能看见耳廓内侧的皮）
  soft("#0d0b0a", 225, [[446,74],[416,146],[398,206],[474,226],[556,238],[506,142]], 0.10, 0.22, 9);
  soft("#3c2f26", 170, [[448,104],[426,162],[414,204],[472,218],[524,226],[490,146]], 0.14, 0.22, 6);
  soft("#57453a", 110, [[450,124],[432,172],[424,200],[470,212],[506,214],[482,152]], 0.18, 0.18, 4);
  soft("#231b16", 130, [[452,168],[440,200],[468,206],[498,204],[486,172]], 0.16, 0.18, 4);

  // 脸最黑的地方：两眼之间往下到口鼻
  soft("#010101", 175, [[340,300],[380,268],[430,266],[468,290],[478,340],[452,382],
                        [400,398],[356,376],[336,340]], 0.14, 0.20, 6);

  // ═══ 6. 眼睛 —— 画面里唯一的暖色 ═══
  eye(360, 336, 27, 25, -10);
  eye(436, 310, 31, 30, 2);

  soft("#221c19", 120, [[318,352],[346,338],[376,344],[386,368],[378,394],[350,406],[322,398],[310,374]], 0.16, 0.18, 5);
  soft("#2e2622", 70,  [[324,356],[348,346],[370,352],[376,372],[366,392],[342,398],[322,388]], 0.20, 0.14, 3);

  // 鼻头
  soft("#3a2a26", 190, [[344,372],[364,366],[374,380],[364,392],[346,388]], 0.10, 0.16, 6);
  soft("#584039", 110, [[348,372],[364,369],[370,379],[358,384]], 0.14, 0.12, 3);

  // ═══ 7. 遥控器（右下角那根白的）═══
  soft("#e2ded4", 215, [[762,570],[800,556],[884,706],[876,750],[830,750],[790,660]], 0.10, 0.18, 8);
  soft("#f2eee6", 120, [[770,574],[796,564],[864,700],[856,730],[834,730],[796,652]], 0.14, 0.14, 4);
  soft("#b4ada2", 110, [[840,676],[884,704],[876,750],[846,750]], 0.16, 0.16, 4);
  soft("#dd5f1c", 230, [[776,660],[804,652],[816,690],[790,698]], 0.08, 0.14, 8);
  soft("#f07d33", 130, [[780,664],[800,658],[808,684],[788,690]], 0.12, 0.12, 4);

  // ═══ 8. 边光（薄薄一条，贴着背脊内侧）═══
  soft("#4e402f", 120, [[600,268],[634,228],[670,184],[710,152],[756,128],[802,116],[850,120],
                        [896,146],[938,186],[930,198],[890,164],[846,140],[802,134],[758,144],
                        [714,168],[676,200],[640,244],[608,282]], 0.18, 0.16, 4);
  // 右耳和左耳的亮边
  soft("#4a3a2a", 95, [[446,74],[506,142],[556,238],[546,240],[498,148],[440,84]], 0.18, 0.12, 3);
  soft("#3e3123", 90, [[260,148],[298,208],[326,270],[318,272],[290,210],[254,154]], 0.18, 0.12, 3);
  // 前胸和前腿的一点侧光
  soft("#2e261e", 80, [[566,300],[586,340],[592,412],[576,414],[558,346]], 0.22, 0.16, 4);
  soft("#241d17", 75, [[556,470],[572,468],[568,600],[556,700],[544,700],[548,596]], 0.20, 0.16, 4);

  // ═══ 9. 线与碎笔触（水彩全部完成之后）═══
  // 背脊线
  brush.set("rotring", "#a68c6b", 1.6);
  brush.spline([[596,276,0.3],[664,196,0.8],[746,134,1.0],[822,116,0.95],[894,146,0.8],[956,208,0.55],[1000,278,0.25]], 0.5);
  brush.set("rotring", "#241c14", 1.2);
  brush.spline([[604,300,0.3],[672,224,0.65],[752,166,0.8],[832,150,0.7],[906,184,0.5]], 0.5);
  // 后腿和尾巴的分界
  brush.set("rotring", "#2b2219", 1.4);
  brush.spline([[906,238,0.3],[930,300,0.7],[934,364,0.7],[912,412,0.4]], 0.5);
  // 前腿轮廓
  brush.set("rotring", "#33291f", 1.2);
  brush.spline([[578,430,0.3],[568,530,0.7],[556,630,0.75],[550,716,0.4]], 0.5);
  brush.spline([[632,486,0.3],[622,570,0.65],[612,660,0.6],[610,700,0.3]], 0.5);
  // 耳廓的褶
  brush.set("rotring", "#6b5645", 1.0);
  brush.spline([[452,140,0.3],[444,176,0.7],[448,204,0.5]], 0.5);
  brush.spline([[472,146,0.3],[470,182,0.65],[478,208,0.45]], 0.5);
  brush.spline([[492,158,0.3],[494,188,0.6],[504,210,0.4]], 0.5);
  // 胡须：短、稀、朝左下散
  brush.set("rotring", "#efe8dc", 0.8);
  const whisk = [
    [[352,386],[318,396],[290,408],[272,416]],
    [[350,376],[312,380],[282,386],[262,390]],
    [[354,394],[324,410],[300,428],[286,442]],
    [[358,400],[334,422],[314,444],[304,460]],
    [[344,368],[310,364],[282,362],[266,362]],
  ];
  for (const w of whisk) brush.spline(w.map((p,i)=>[p[0],p[1],[0.95,0.6,0.3,0.1][i]]), 0.5);
  // 眉毛上那几根
  brush.set("rotring", "#e0d8ca", 0.6);
  brush.spline([[352,288,0.85],[318,262,0.5],[292,246,0.14]], 0.5);
  brush.spline([[432,262,0.85],[452,232,0.5],[464,212,0.14]], 0.5);

  // 德文卷毛的毛浪：最后撒，短、顺着体块走
  brush.set("cpencil", "#3b3026", 0.7);
  for (let i = 0; i < 34; i++) {
    const t = random(0, 1);
    const x = 600 + t * 340 + random(-14, 14);
    const y = 190 + Math.pow(t, 0.7) * 40 + random(-16, 46);
    brush.spline([[x,y,0.5],[x+16,y+8,0.8],[x+34,y+6,0.4]], 0.6);
  }
  brush.set("cpencil", "#2a221b", 0.6);
  for (let i = 0; i < 26; i++) {
    const x = random(660, 960);
    const y = random(300, 430);
    brush.spline([[x,y,0.4],[x+14,y+10,0.7],[x+30,y+8,0.3]], 0.6);
  }
}

function eye(cx, cy, rx, ry, tilt) {
  // 金色虹膜
  soft("#b08a26", 235, ring(cx, cy, rx, ry, tilt), 0.06, 0.12, 9);
  soft("#d3ad3c", 140, ring(cx, cy, rx*0.88, ry*0.88, tilt), 0.10, 0.10, 5);
  soft("#a8801f", 110, ring(cx, cy+ry*0.42, rx*0.82, ry*0.44, tilt), 0.12, 0.10, 4);
  // 瞳孔
  soft("#040403", 240, ring(cx, cy+ry*0.06, rx*0.76, ry*0.84, tilt), 0.05, 0.10, 11);
  // 高光
  soft("#f6f0dd", 220, ring(cx - rx*0.30, cy - ry*0.34, rx*0.17, ry*0.17, 0), 0.05, 0.08, 7);
  soft("#cfc4a6", 110, ring(cx + rx*0.34, cy + ry*0.30, rx*0.11, ry*0.10, 0), 0.08, 0.08, 4);
  // 眼眶压一圈深色，眼球才嵌进脸里
  soft("#0a0806", 120, ringGap(cx, cy, rx*1.16, ry*1.16, rx*0.98, ry*0.98, tilt), 0.10, 0.12, 4);
}

function ring(cx, cy, rx, ry, tilt) {
  const p = [];
  for (let a = 0; a < 360; a += 18) {
    const r = radians(a), t = radians(tilt);
    const x = rx * Math.cos(r), y = ry * Math.sin(r);
    p.push([cx + x*Math.cos(t) - y*Math.sin(t), cy + x*Math.sin(t) + y*Math.cos(t)]);
  }
  return p;
}
function ringGap(cx, cy, rx, ry, ix, iy, tilt) {
  // 一个薄环，用外圈顺时针 + 内圈逆时针近似
  return ring(cx, cy, rx, ry, tilt).concat(ring(cx, cy, ix, iy, tilt).reverse());
}

function soft(col, op, pts, bleed, tex, layers) {
  layers = layers || 1;
  brush.noStroke();
  for (let k = 0; k < layers; k++) {
    const j = k === 0 ? 0 : 2.0;
    brush.fill(col, op);
    brush.fillBleed(bleed * (1 - k * 0.05), "out");
    brush.fillTexture(tex, 0.12, false);
    brush.beginShape(0.3);
    for (const p of pts) brush.vertex(p[0] + random(-j, j), p[1] + random(-j, j));
    brush.endShape(true);
  }
  brush.noFill();
}
</script>
